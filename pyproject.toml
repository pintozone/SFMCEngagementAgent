[project]
name = "sfmc-campaign-kit"
version = "0.1.0"
description = "Brief-driven SFMC campaign builder (DEs, automations, emails, journeys, Data View analytics) with an offline mock tenant"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sfmc-kit = "sfmc_kit.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
